/* =============================================================================
   The calculation layer. Takes the raw inputs from data.js and returns the
   figures the board draws. Nothing here is stored — change an input and every
   number that depends on it moves. This is what makes the edit panel work.
   ========================================================================== */

const Model = (() => {
  const sum = (xs, f) => xs.reduce((a, x) => a + (f ? f(x) : x), 0);
  const num = (v) => (typeof v === "number" && isFinite(v) ? v : null);
  const div = (a, b) => (b ? a / b : null);

  function build(raw) {
    const m = { raw };

    /* -- monthly actuals -------------------------------------------------- */
    m.months = (raw.months || []).map((x) => {
      const adc = div(x.childDays, x.opDays);
      const net = num(x.revenue) !== null && num(x.cost) !== null ? x.revenue - x.cost : null;
      return {
        ...x,
        adc,
        dormant: x.onReport - x.enrolled,
        attendance: div(adc, x.enrolled),
        net,
        margin: net === null ? null : div(net, x.revenue),
        revenuePerChildDay: num(x.revenue) === null ? null : div(x.revenue, x.childDays)
      };
    });
    m.moneyMonths = m.months.filter((x) => x.net !== null);
    m.latest = m.months[m.months.length - 1] || null;
    m.prior = m.months[m.months.length - 2] || null;
    m.latestMoney = m.moneyMonths[m.moneyMonths.length - 1] || null;
    m.priorMoney = m.moneyMonths[m.moneyMonths.length - 2] || null;

    /* Realized rate: what the centre has actually collected per child-day.
       Calculated, never typed in — it is the honest check on the day rate. */
    const ytdRev = sum(m.moneyMonths, (x) => x.revenue);
    const ytdDays = sum(m.moneyMonths, (x) => x.childDays);
    m.ytd = {
      revenue: ytdRev, childDays: ytdDays, cost: sum(m.moneyMonths, (x) => x.cost),
      net: sum(m.moneyMonths, (x) => x.net),
      perChildDay: div(ytdRev, ytdDays)
    };
    m.ytd.realization = div(m.ytd.perChildDay, raw.perDiem);

    /* -- projection ------------------------------------------------------- */
    const p = raw.projection;
    if (p && p.months && p.months.length) {
      const rate = p.attendanceRate, perDiem = raw.perDiem;
      const months = p.months.map((x) => {
        const opDays = x.weekdays - x.closures;
        const adc = x.enrolled * rate;
        return { ...x, opDays, adc, revenue: adc * opDays * perDiem };
      });
      const totalOpDays = sum(months, (x) => x.opDays);
      const pendingMonths = months.filter((x) => x.enrolled > (raw.roster ? raw.roster.enrolled : 0));
      m.projection = {
        ...p, months, totalOpDays,
        totalWeekdays: sum(months, (x) => x.weekdays),
        totalClosures: sum(months, (x) => x.closures),
        totalRevenue: sum(months, (x) => x.revenue),
        avgOpDays: Math.round(totalOpDays / months.length),
        perChildPerMonth: rate * Math.round(totalOpDays / months.length) * perDiem,
        pendingValue: raw.roster
          ? raw.roster.pending * rate * sum(pendingMonths, (x) => x.opDays) * perDiem : null,
        pendingMonthCount: pendingMonths.length
      };
      m.projection.atRealizedRate = m.ytd.realization
        ? m.projection.totalRevenue * m.ytd.realization : null;
    }

    /* -- rooms ------------------------------------------------------------ */
    if (raw.rooms && raw.rooms.list) {
      const opDays = m.latest ? m.latest.opDays : null;
      m.rooms = {
        ...raw.rooms,
        list: raw.rooms.list.map((r) => ({ ...r, adc: div(r.childDays, opDays) })),
        attending: sum(raw.rooms.list, (r) => r.attending),
        onReport: sum(raw.rooms.list, (r) => r.onReport)
      };
      m.rooms.adc = sum(m.rooms.list, (r) => r.adc || 0);
    }

    /* -- cost structure --------------------------------------------------- */
    if (raw.costLines && raw.costLines.lines) {
      const lines = raw.costLines.lines.slice().sort((a, b) => b.current - a.current);
      const totalCurrent = sum(lines, (l) => l.current);
      m.costLines = {
        ...raw.costLines,
        lines: lines.map((l) => ({ ...l, change: l.current - l.prior, share: div(l.current, totalCurrent) })),
        totalCurrent, totalPrior: sum(lines, (l) => l.prior),
        overTarget: raw.targets ? totalCurrent - raw.targets.monthlyCost : null
      };
      m.costLines.change = m.costLines.totalCurrent - m.costLines.totalPrior;
    }

    /* -- cash ------------------------------------------------------------- */
    if (raw.cash && raw.cash.lines) {
      const cashLine = raw.cash.lines.find((l) => l.value > 0);
      m.cash = {
        ...raw.cash,
        inBank: cashLine ? cashLine.value : 0,
        obligations: -sum(raw.cash.lines.filter((l) => l.value < 0), (l) => l.value),
        net: sum(raw.cash.lines, (l) => l.value)
      };
    }

    /* -- staffing --------------------------------------------------------- */
    if (raw.staffing && raw.staffing.roles) {
      const byType = (t) => sum(raw.staffing.roles.filter((r) => r.type === t), (r) => r.count);
      const dm = raw.staffing.dailyModel;
      m.staffing = {
        ...raw.staffing,
        fullTime: byType("Full time"), partTime: byType("Part time"), perDiem: byType("Per diem"),
        total: sum(raw.staffing.roles, (r) => r.count)
      };
      if (dm && dm.lines) {
        const perDay = sum(dm.lines, (l) => l.perDay);
        m.staffing.dailyModel = {
          ...dm, perDay,
          lines: dm.lines.map((l) => ({ ...l, spare: l.roster - l.perDay })),
          scheduled: m.staffing.fullTime + m.staffing.partTime,
          childrenPerStaff: div(dm.supports, perDay),
          atProjected: m.projection && m.projection.months.length
            ? div(m.projection.months[m.projection.months.length - 1].adc, perDay) : null
        };
      }
    }

    /* -- marketing -------------------------------------------------------- */
    if (raw.adSpend && raw.adSpend.months) {
      const ytd = sum(raw.adSpend.months, (x) => x.value);
      m.adSpend = { ...raw.adSpend, ytd, vsPrior: div(ytd, raw.adSpend.ytdPrior),
                    latest: raw.adSpend.months[raw.adSpend.months.length - 1] };
    }

    /* -- roster ----------------------------------------------------------- */
    if (raw.roster) {
      m.roster = {
        ...raw.roster,
        awaitingApproval: raw.roster.enrolled - raw.roster.medicaidApproved,
        approvedShare: div(raw.roster.medicaidApproved, raw.roster.enrolled),
        shortOfTarget: raw.targets ? raw.targets.enrollment - raw.roster.enrolled : null,
        withPending: raw.roster.enrolled + raw.roster.pending
      };
    }


    /* -- distributions & reserve ------------------------------------------ */
    const d = raw.distributions;
    if (d && m.projection) {
      let reserve = d.startingReserve, debt = d.startingDebt;
      const schedule = m.projection.months.map((x) => {
        const funded = reserve >= d.reserveTarget && debt <= 0;
        const split = funded ? d.onceFunded : d.whileBuilding;
        const net = x.revenue - d.assumedMonthlyCost;
        // A loss is not distributed — it comes out of the reserve.
        const toSavings = net > 0 ? net * (split.savings || 0) : net;
        const toDebt = net > 0 ? Math.min(net * (split.debt || 0), debt) : 0;
        const toOwners = net > 0 ? net * (split.owners || 0) : 0;
        const toReinvest = net > 0 ? net * (split.reinvest || 0) : 0;
        reserve += toSavings;
        debt -= toDebt;
        return { ...x, net, toSavings, toDebt, toOwners, toReinvest,
                 reserve, debt, phase: funded ? "funded" : "building" };
      });
      const tot = (k) => sum(schedule, (x) => x[k]);
      const owners = tot("toOwners");
      const equity = sum(d.members || [], (x) => x.equity);
      const hitsTarget = schedule.find((x) => x.reserve >= d.reserveTarget);
      m.distributions = {
        ...d, schedule,
        totals: { net: tot("net"), savings: tot("toSavings"), debt: tot("toDebt"),
                  owners, reinvest: tot("toReinvest") },
        endReserve: schedule.length ? schedule[schedule.length - 1].reserve : d.startingReserve,
        endDebt: schedule.length ? schedule[schedule.length - 1].debt : d.startingDebt,
        reserveNow: div(d.startingReserve, d.reserveTarget),
        targetMonth: hitsTarget ? hitsTarget.full : null,
        equity,
        members: (d.members || []).map((x) => ({
          ...x, share: div(x.equity, equity), amount: owners * div(x.equity, equity)
        })),
        // What the reserve target is worth in months at the assumed cost
        monthsCovered: div(d.reserveTarget, d.assumedMonthlyCost),
        downside: m.ytd.realization
          ? sum(m.projection.months, (x) => x.revenue * m.ytd.realization - d.assumedMonthlyCost) : null
      };
      m.distributions.downsideOwners = m.distributions.downside === null ? null
        : Math.max(0, m.distributions.downside) * d.whileBuilding.owners;
    }

    return m;
  }

  return { build };
})();


/* =============================================================================
   Chart primitives — hand-rolled SVG. No charting library.
   Four forms only: line (with projection), column, horizontal bar, sparkline.
   Shared rules: 2px lines, ≤24px bars with 4px rounded data-ends, 2px surface
   gaps and rings, hairline solid grid, selective direct labels, one y-axis.
   ========================================================================== */

const Charts = (() => {
  const NS = "http://www.w3.org/2000/svg";
  const el = (name, attrs = {}) => {
    const n = document.createElementNS(NS, name);
    for (const k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
    return n;
  };
  const css = (name) =>
    getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  /* -- number formatting -------------------------------------------------- */
  const fmt = {
    int:   (v) => Math.round(v).toLocaleString("en-US"),
    dec1:  (v) => v.toFixed(1),
    dec2:  (v) => v.toFixed(2),
    pct0:  (v) => Math.round(v * 100) + "%",
    pct1:  (v) => (v * 100).toFixed(1) + "%",
    usd:   (v) => (v < 0 ? "−$" : "$") + Math.abs(Math.round(v)).toLocaleString("en-US"),
    usdk:  (v) => {
      const s = v < 0 ? "−$" : "$", a = Math.abs(v);
      return a >= 1000 ? s + (a / 1000).toFixed(a % 1000 === 0 ? 0 : 1) + "K" : s + Math.round(a);
    },
    usdk0: (v) => (v < 0 ? "−$" : "$") + Math.round(Math.abs(v) / 1000) + "K"
  };

  /* -- rounded data-end paths --------------------------------------------- */
  // Column: square at the baseline, 4px rounded cap on top.
  function columnPath(x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h));
    return `M${x},${y + h} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + h} Z`;
  }
  // Horizontal bar: square at the baseline (left), 4px rounded tip on the right.
  function barPath(x, y, w, h, r) {
    r = Math.max(0, Math.min(r, w, h / 2));
    return `M${x},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + h - r} Q${x + w},${y + h} ${x + w - r},${y + h} L${x},${y + h} Z`;
  }

  /* -- nice axis ticks ----------------------------------------------------- */
  function ticks(min, max, count = 4) {
    if (max === min) max = min + 1;
    const raw = (max - min) / count;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const norm = raw / mag;
    const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10) * mag;
    const lo = Math.floor(min / step) * step;
    const hi = Math.ceil(max / step) * step;
    const out = [];
    for (let v = lo; v <= hi + step / 1000; v += step) out.push(Math.round(v * 1e6) / 1e6);
    return out;
  }

  // Text sits on top of lines and gridlines; a surface-colored halo keeps it
  // readable without adding a box. Width is estimated from the mono metrics.
  function haloText(svg, x, y, text, cls, anchor) {
    const w = text.length * 6.1 + 8;
    const left = anchor === "end" ? x - w + 4 : x - 4;
    svg.appendChild(el("rect", {
      x: left, y: y - 9.5, width: w, height: 13, rx: 2,
      fill: css("--chart-bg"), opacity: .88
    }));
    const t = el("text", { x, y, class: cls, "text-anchor": anchor === "end" ? "end" : "start" });
    t.textContent = text;
    svg.appendChild(t);
  }

  /* -- tooltip ------------------------------------------------------------- */
  function makeTip(host) {
    let tip = host.querySelector(".chart-tip");
    if (!tip) {
      tip = document.createElement("div");
      tip.className = "chart-tip";
      host.appendChild(tip);
    }
    return {
      show(x, y, html) {
        tip.innerHTML = html;
        const w = host.clientWidth;
        tip.style.left = Math.max(70, Math.min(w - 70, x)) + "px";
        tip.style.top = Math.max(34, y - 10) + "px";
        tip.dataset.show = "1";
      },
      hide() { tip.dataset.show = "0"; }
    };
  }

  const tipRows = (rows) =>
    rows.map((r) =>
      `<div class="tip-row">${r.color ? `<span class="sw" style="background:${r.color}"></span>` : ""}` +
      `<span>${r.label}</span><span class="v">${r.value}</span></div>`).join("");

  /* -- responsive host ----------------------------------------------------- */
  function mount(host, draw) {
    const render = () => {
      const w = host.clientWidth;
      if (!w) return;
      const old = host.querySelector("svg");
      if (old) old.remove();
      host.insertBefore(draw(w), host.firstChild);
    };
    render();
    // Re-mounting the same host (a filter change) must not stack observers.
    if (host.__akpRO) host.__akpRO.disconnect();
    if (window.ResizeObserver) {
      let last = host.clientWidth;
      const ro = new ResizeObserver(() => {
        if (Math.abs(host.clientWidth - last) > 1) { last = host.clientWidth; render(); }
      });
      ro.observe(host);
      host.__akpRO = ro;
    }
    if (host.__akpTheme) document.removeEventListener("akp:theme", host.__akpTheme);
    host.__akpTheme = render;
    document.addEventListener("akp:theme", render);
    return render;
  }

  /* =========================================================================
     LINE — 1..2 series on one axis, optional projected tail, optional target
     reference line. Crosshair tooltip + arrow-key navigation.
     ====================================================================== */
  function line(host, opts) {
    const {
      labels, series, format = fmt.int, height = 224,
      projectFrom = null, target = null, yZero = false, tipTitle = (i) => labels[i]
    } = opts;
    const tip = makeTip(host);
    let focus = -1;

    const draw = (W) => {
      const surface = css("--chart-bg") || "#fff";
      const M = { t: 16, r: 54, b: 26, l: 46 };
      const H = height, iw = Math.max(60, W - M.l - M.r), ih = H - M.t - M.b;

      const all = series.flatMap((s) => s.values).concat(target ? [target.value] : []);
      let lo = Math.min(...all), hi = Math.max(...all);
      if (yZero) lo = 0;
      const pad = (hi - lo) * 0.12 || 1;
      const tk = ticks(yZero ? 0 : lo - pad, hi + pad, 4);
      const yMin = tk[0], yMax = tk[tk.length - 1];
      const X = (i) => M.l + (labels.length === 1 ? iw / 2 : (i * iw) / (labels.length - 1));
      const Y = (v) => M.t + ih - ((v - yMin) / (yMax - yMin)) * ih;

      const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
      let drawTargetLabel = null;

      // projected region wash + label
      if (projectFrom !== null && projectFrom < labels.length) {
        const x0 = X(projectFrom - 0.5 < 0 ? 0 : projectFrom) - (iw / (labels.length - 1)) / 2;
        svg.appendChild(el("rect", {
          x: x0, y: M.t, width: M.l + iw - x0, height: ih,
          fill: css("--surface-3"), opacity: .55
        }));
        const pl = el("text", { x: x0 + 6, y: M.t + ih - 6, class: "ref-label" });
        pl.textContent = "PROJECTED";
        svg.appendChild(pl);
      }

      // gridlines + y ticks
      tk.forEach((v) => {
        svg.appendChild(el("line", { x1: M.l, x2: M.l + iw, y1: Y(v), y2: Y(v), class: "grid-line" }));
        const t = el("text", { x: M.l - 8, y: Y(v) + 3.5, class: "tick", "text-anchor": "end" });
        t.textContent = format(v);
        svg.appendChild(t);
      });
      svg.appendChild(el("line", { x1: M.l, x2: M.l + iw, y1: M.t + ih, y2: M.t + ih, class: "axis-line" }));

      // target reference
      if (target) {
        svg.appendChild(el("line", { x1: M.l, x2: M.l + iw, y1: Y(target.value), y2: Y(target.value), class: "ref-line" }));
        // The rule stays under the data; its label is drawn after the series
        // so a line never runs through the text.
        drawTargetLabel = () => haloText(svg, M.l + 6, Y(target.value) - 6, target.label, "ref-label");
      }

      // x labels — thinned so they never collide
      const every = Math.ceil((labels.length * 34) / iw);
      let lastX = -Infinity;
      labels.forEach((l, i) => {
        const forced = i === labels.length - 1;
        if (i % every !== 0 && !forced) return;
        if (X(i) - lastX < 30) return;          // no crowding at the tail
        lastX = X(i);
        const t = el("text", { x: X(i), y: H - 8, class: "tick", "text-anchor": "middle" });
        t.textContent = l;
        svg.appendChild(t);
      });

      // series
      const ends = [];
      series.forEach((s) => {
        const color = css(s.colorVar);
        const solidEnd = projectFrom === null ? s.values.length : Math.min(projectFrom, s.values.length);
        const d = (from, to) => s.values.slice(from, to)
          .map((v, k) => `${k === 0 ? "M" : "L"}${X(from + k)},${Y(v)}`).join(" ");
        svg.appendChild(el("path", {
          d: d(0, solidEnd), fill: "none", stroke: color,
          "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round"
        }));
        if (projectFrom !== null && projectFrom < s.values.length) {
          svg.appendChild(el("path", {
            d: d(Math.max(0, projectFrom - 1), s.values.length), fill: "none", stroke: color,
            "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round",
            "stroke-dasharray": "2 5", opacity: .85
          }));
        }
        // endpoint marker with a 2px surface ring
        const last = s.values.length - 1;
        svg.appendChild(el("circle", {
          cx: X(last), cy: Y(s.values[last]), r: 4.5,
          fill: color, stroke: surface, "stroke-width": 2
        }));
        ends.push({ x: X(last), y: Y(s.values[last]), text: (s.endFormat || format)(s.values[last]) });
      });

      // Direct end labels. Where two series land close together, separate the
      // labels and run a leader line back to the mark rather than stacking them.
      ends.sort((a, b) => a.y - b.y);
      const MIN_GAP = 13;
      for (let i = 1; i < ends.length; i++) {
        const gap = (ends[i].ly ?? ends[i].y) - (ends[i - 1].ly ?? ends[i - 1].y);
        if (gap < MIN_GAP) {
          const push = (MIN_GAP - gap) / 2;
          ends[i - 1].ly = (ends[i - 1].ly ?? ends[i - 1].y) - push;
          ends[i].ly = (ends[i].ly ?? ends[i].y) + push;
        }
      }
      ends.forEach((e) => {
        const ly = e.ly ?? e.y;
        if (Math.abs(ly - e.y) > 1) {
          svg.appendChild(el("path", {
            d: `M${e.x + 5.5},${e.y} L${e.x + 7.5},${ly - 3.5}`,
            stroke: css("--axis"), "stroke-width": 1, fill: "none"
          }));
        }
        const lab = el("text", { x: e.x + 9, y: ly + 4, class: "dlabel" });
        lab.textContent = e.text;
        svg.appendChild(lab);
      });
      if (drawTargetLabel) drawTargetLabel();

      // hover layer
      const cross = el("line", { x1: 0, x2: 0, y1: M.t, y2: M.t + ih, class: "ref-line", opacity: 0 });
      svg.appendChild(cross);
      const dots = series.map((s) => {
        const c = el("circle", { r: 4.5, fill: css(s.colorVar), stroke: surface, "stroke-width": 2, opacity: 0 });
        svg.appendChild(c);
        return c;
      });

      const at = (i) => {
        cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i)); cross.setAttribute("opacity", .8);
        series.forEach((s, k) => {
          dots[k].setAttribute("cx", X(i)); dots[k].setAttribute("cy", Y(s.values[i]));
          dots[k].setAttribute("opacity", 1);
        });
        tip.show(X(i), Y(Math.max(...series.map((s) => s.values[i]))), 
          `<div class="tip-title">${tipTitle(i)}</div>` +
          tipRows(series.map((s) => ({ color: css(s.colorVar), label: s.name, value: (s.tipFormat || format)(s.values[i]) }))) +
          (opts.tipNote ? `<div class="tip-note">${opts.tipNote(i)}</div>` : ""));
        focus = i;
      };
      const off = () => { cross.setAttribute("opacity", 0); dots.forEach((d) => d.setAttribute("opacity", 0)); tip.hide(); focus = -1; };

      const slot = iw / Math.max(1, labels.length - 1);
      labels.forEach((_, i) => {
        const r = el("rect", {
          x: X(i) - slot / 2, y: M.t, width: slot, height: ih, fill: "transparent"
        });
        r.addEventListener("mouseenter", () => at(i));
        svg.appendChild(r);
      });
      svg.addEventListener("mouseleave", off);
      host.tabIndex = 0;
      host.onkeydown = (e) => {
        if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
          e.preventDefault();
          const n = focus < 0 ? 0 : focus + (e.key === "ArrowRight" ? 1 : -1);
          at(Math.max(0, Math.min(labels.length - 1, n)));
        } else if (e.key === "Escape") off();
      };
      host.onblur = off;
      return svg;
    };
    return mount(host, draw);
  }

  /* =========================================================================
     COLUMN — one series, optional target hairline. Per-mark hover.
     ====================================================================== */
  function columns(host, opts) {
    const {
      labels, values, colorVar = "--series-1", format = fmt.int, height = 200,
      target = null, yFormat = null, tipTitle = (i) => labels[i], states = null
    } = opts;
    const tip = makeTip(host);

    const draw = (W) => {
      const M = { t: 14, r: 12, b: 30, l: 42 };
      const H = height, iw = Math.max(60, W - M.l - M.r), ih = H - M.t - M.b;
      // Columns always grow from zero — a truncated baseline misstates bar length.
      const hi = Math.max(...values, target ? target.value : 0);
      const tk = ticks(0, hi * 1.08, 4);
      const yMin = tk[0], yMax = tk[tk.length - 1];
      const Y = (v) => M.t + ih - ((v - yMin) / (yMax - yMin)) * ih;
      const band = iw / values.length;
      const bw = Math.min(24, Math.max(4, band - 6));      // ≤24px, air in the band
      const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });

      tk.forEach((v) => {
        svg.appendChild(el("line", { x1: M.l, x2: M.l + iw, y1: Y(v), y2: Y(v), class: "grid-line" }));
        const t = el("text", { x: M.l - 8, y: Y(v) + 3.5, class: "tick", "text-anchor": "end" });
        t.textContent = (yFormat || format)(v);
        svg.appendChild(t);
      });
      svg.appendChild(el("line", { x1: M.l, x2: M.l + iw, y1: M.t + ih, y2: M.t + ih, class: "axis-line" }));

      let drawTargetLabel = null;
      if (target) {
        svg.appendChild(el("line", { x1: M.l, x2: M.l + iw, y1: Y(target.value), y2: Y(target.value), class: "ref-line" }));
        drawTargetLabel = () => haloText(svg, M.l + iw, Y(target.value) - 5, target.label, "ref-label", "end");
      }

      values.forEach((v, i) => {
        const x = M.l + band * i + (band - bw) / 2;
        const y = Y(v), h = M.t + ih - y;
        const color = states ? css(states[i]) : css(colorVar);
        const p = el("path", { d: columnPath(x, y, bw, Math.max(1, h), 4), fill: color });
        svg.appendChild(p);
        const hit = el("rect", { x: M.l + band * i, y: M.t, width: band, height: ih, fill: "transparent" });
        hit.addEventListener("mouseenter", () => {
          tip.show(x + bw / 2, y, `<div class="tip-title">${tipTitle(i)}</div>` +
            tipRows([{ color, label: opts.seriesName || "Value", value: format(v) }]) +
            (opts.tipNote ? `<div class="tip-note">${opts.tipNote(i)}</div>` : ""));
        });
        svg.appendChild(hit);
      });
      svg.addEventListener("mouseleave", () => tip.hide());
      if (drawTargetLabel) drawTargetLabel();

      const every = Math.ceil((labels.length * 40) / iw);
      labels.forEach((l, i) => {
        if (i % every !== 0 && i !== labels.length - 1) return;
        const t = el("text", { x: M.l + band * i + band / 2, y: H - 14, class: "tick", "text-anchor": "middle" });
        t.textContent = l;
        svg.appendChild(t);
        if (opts.sublabels) {
          const s = el("text", { x: M.l + band * i + band / 2, y: H - 3, class: "tick", "text-anchor": "middle", opacity: .75 });
          s.textContent = opts.sublabels[i];
          svg.appendChild(s);
        }
      });
      return svg;
    };
    return mount(host, draw);
  }

  /* =========================================================================
     BAR — horizontal, one color per set (or an ordinal ramp for ordered
     stages). Value labels ride the tip; labels sit above each bar.
     ====================================================================== */
  function bars(host, opts) {
    const { rows, format = fmt.int, colorVar = "--series-1", ramp = null, height = null } = opts;
    const tip = makeTip(host);

    const draw = (W) => {
      const rowH = 32, barH = 14, labelH = 15;
      const M = { t: 4, r: 4, b: 4, l: 0 };
      const H = height || M.t + rows.length * rowH + M.b;
      const maxV = Math.max(...rows.map((r) => r.value), 1);
      const valW = 58;
      const iw = Math.max(40, W - valW - 4);
      const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });

      rows.forEach((r, i) => {
        const top = M.t + i * rowH;
        const name = el("text", { x: 0, y: top + 10, class: "bar-name" });
        name.textContent = r.label;
        svg.appendChild(name);

        const w = Math.max(2, (r.value / maxV) * iw);
        const color = ramp ? css(ramp[Math.min(i, ramp.length - 1)]) : css(r.colorVar || colorVar);
        svg.appendChild(el("path", { d: barPath(0, top + labelH, w, barH, 4), fill: color }));

        const v = el("text", { x: w + 8, y: top + labelH + barH - 2.5, class: "dlabel" });
        v.textContent = format(r.value);
        svg.appendChild(v);

        const hit = el("rect", { x: 0, y: top, width: W, height: rowH, fill: "transparent" });
        hit.addEventListener("mouseenter", () => {
          tip.show(Math.min(w, iw * .8), top + labelH,
            `<div class="tip-title">${r.label}</div>` +
            tipRows([{ color, label: opts.seriesName || "Value", value: format(r.value) }]) +
            (r.note ? `<div class="tip-note">${r.note}</div>` : ""));
        });
        svg.appendChild(hit);
      });
      svg.addEventListener("mouseleave", () => tip.hide());
      return svg;
    };
    return mount(host, draw);
  }

  /* =========================================================================
     SPARKLINE — 12 points, de-emphasised, current period accented.
     ====================================================================== */
  function sparkline(host, values, opts = {}) {
    const draw = (W) => {
      const H = opts.height || 40, P = 6;
      const lo = Math.min(...values), hi = Math.max(...values);
      const X = (i) => P + (i * (W - P * 2 - 8)) / (values.length - 1);
      const Y = (v) => H - P - ((v - lo) / (hi - lo || 1)) * (H - P * 2);
      const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-hidden": "true" });
      const d = values.map((v, i) => `${i ? "L" : "M"}${X(i)},${Y(v)}`).join(" ");
      const area = `${d} L${X(values.length - 1)},${H - P} L${X(0)},${H - P} Z`;
      svg.appendChild(el("path", { d: area, fill: css("--series-1"), opacity: .10 }));
      svg.appendChild(el("path", {
        d, fill: "none", stroke: css("--series-1"), "stroke-width": 2,
        "stroke-linejoin": "round", "stroke-linecap": "round", opacity: .55
      }));
      svg.appendChild(el("circle", {
        cx: X(values.length - 1), cy: Y(values[values.length - 1]), r: 4,
        fill: css("--series-1"), stroke: css("--chart-bg"), "stroke-width": 2
      }));
      return svg;
    };
    return mount(host, draw);
  }

  return { line, columns, bars, sparkline, fmt, ticks };
})();


/* =============================================================================
   The edit panel. Changing a field updates the inputs and re-renders the whole
   board immediately, so every calculated figure moves with it. Save publishes a
   new version of the page, which is what every viewer then opens.

   Saving needs the artifact runtime, so it works on the published board and not
   on a file opened from disk — there, edits are live but local to the tab.
   ========================================================================== */

const Editor = (() => {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  /* -- what is editable, in the order it appears in the panel ------------- */
  const SECTIONS = [
    { title: "The roster today", blocks: [{ fields: [
      ["roster.enrolled", "Children enrolled", "int"],
      ["roster.medicaidApproved", "Approved through Medicaid", "int"],
      ["roster.pending", "Pending enrollment", "int"]
    ] }] },

    { title: "Targets and the day rate", blocks: [{ fields: [
      ["targets.enrollment", "Enrollment goal", "int"],
      ["targets.monthlyCost", "Monthly cost target", "usd"],
      ["perDiem", "Day rate, per child per day", "usd2"]
    ] }] },

    { title: "Projection", blocks: [
      { fields: [["projection.attendanceRate", "Attendance rate assumed", "pct"]] },
      { rows: { path: "projection.months", label: "full",
        cols: [["weekdays", "Weekdays", "int"], ["closures", "Closed", "int"], ["enrolled", "Enrolled", "int"]] } }
    ] },

    { title: "Monthly actuals", blocks: [
      { rows: { path: "months", label: "full", cols: [
        ["enrolled", "Attended", "int"], ["onReport", "On report", "int"],
        ["opDays", "Op days", "int"], ["childDays", "Child-days", "int"],
        ["revenue", "Revenue", "usd2"], ["cost", "Cost", "usd2"]] } }
    ] },

    { title: "Distributions and savings", blocks: [
      { fields: [
        ["distributions.reserveTarget", "Savings target", "usd"],
        ["distributions.assumedMonthlyCost", "Assumed monthly cost", "usd2"],
        ["distributions.startingReserve", "Reserve in the bank today", "usd2"],
        ["distributions.startingDebt", "Revolving debt outstanding", "usd2"],
        ["distributions.whileBuilding.savings", "Share to savings", "pct"],
        ["distributions.whileBuilding.debt", "Share to debt paydown", "pct"],
        ["distributions.whileBuilding.owners", "Share to owner distributions", "pct"]
      ] }
    ] },

    { title: "Staffing", blocks: [
      { rows: { path: "staffing.roles", label: "role", cols: [["count", "Staff", "int"]] } },
      { fields: [["staffing.dailyModel.supports", "The model supports this many children", "int"]] },
      { rows: { path: "staffing.dailyModel.lines", label: "role",
        cols: [["perDay", "On the floor daily", "int"], ["roster", "On the roster", "int"]] } }
    ] },

    { title: "Cash", blocks: [
      { rows: { path: "cash.lines", label: "name", cols: [["value", "Balance", "usd2"]] } },
      { fields: [["cash.ytdNet", "Net income, year to date", "usd2"]] }
    ] },

    { title: "Marketing spend", blocks: [
      { rows: { path: "adSpend.months", label: "label", cols: [["value", "Spend", "usd2"]] } },
      { fields: [["adSpend.ytdPrior", "Same period last year", "usd2"]] }
    ] }
  ];

  const get = (o, path) => path.split(".").reduce((a, k) => (a == null ? a : a[k]), o);
  const set = (o, path, v) => {
    const keys = path.split("."), last = keys.pop();
    const t = keys.reduce((a, k) => (a == null ? a : a[k]), o);
    if (t) t[last] = v;
  };
  const toInput = (v, type) => {
    if (v === null || v === undefined) return "";
    return type === "pct" ? +(v * 100).toFixed(2) : v;
  };
  const fromInput = (s, type) => {
    if (s === "") return null;
    const n = Number(s);
    if (!isFinite(n)) return null;
    return type === "pct" ? n / 100 : type === "int" ? Math.round(n) : n;
  };
  const unit = (type) => (type === "pct" ? "%" : type === "usd" || type === "usd2" ? "$" : "");
  const step = (type) => (type === "int" ? "1" : type === "pct" ? "1" : "0.01");

  let dirty = false, publisher = null, publisherResolved = false;

  function field(path, label, type) {
    const v = toInput(get(window.AKP_STATE.raw, path), type);
    return `<label class="ed-field">
      <span class="ed-label">${esc(label)}${unit(type) ? ` <em>${unit(type)}</em>` : ""}</span>
      <input type="number" step="${step(type)}" value="${v === "" ? "" : esc(v)}"
             data-path="${esc(path)}" data-type="${type}" inputmode="decimal">
    </label>`;
  }

  function rowsBlock(spec) {
    const list = get(window.AKP_STATE.raw, spec.path) || [];
    return `<div class="ed-rows"><table class="ed-table">
      <thead><tr><th></th>${spec.cols.map((c) => `<th>${esc(c[1])}</th>`).join("")}</tr></thead>
      <tbody>${list.map((row, i) => `<tr>
        <th scope="row">${esc(row[spec.label])}</th>
        ${spec.cols.map(([key, , type]) => {
          const v = toInput(row[key], type);
          return `<td><input type="number" step="${step(type)}" value="${v === "" ? "" : esc(v)}"
                    data-path="${esc(spec.path)}.${i}.${esc(key)}" data-type="${type}"
                    aria-label="${esc(row[spec.label])} ${esc(key)}" inputmode="decimal"></td>`;
        }).join("")}
      </tr>`).join("")}</tbody>
    </table></div>`;
  }

  function build() {
    $("#ed-body").innerHTML = SECTIONS.map((s, i) => `
      <details class="ed-section"${i === 0 ? " open" : ""}>
        <summary>${esc(s.title)}</summary>
        ${s.blocks.map((b) => b.fields
          ? `<div class="ed-grid">${b.fields.map((f) => field(f[0], f[1], f[2])).join("")}</div>`
          : rowsBlock(b.rows)).join("")}
      </details>`).join("");

    $$("#ed-body input").forEach((input) => {
      input.addEventListener("input", () => {
        set(window.AKP_STATE.raw, input.dataset.path, fromInput(input.value, input.dataset.type));
        dirty = true;
        window.AKP_RENDER();
        status(unsavedMessage(), "warning");
        checkSplit();
      });
    });
    checkSplit();
  }

  // The three shares are a split of net income; over 100% would be spending
  // money twice, so say so rather than quietly producing nonsense.
  function checkSplit() {
    const d = get(window.AKP_STATE.raw, "distributions.whileBuilding");
    const warn = $("#ed-split-warning");
    if (!d || !warn) return;
    const total = (d.savings || 0) + (d.debt || 0) + (d.owners || 0);
    if (total > 1.0001) {
      warn.hidden = false;
      warn.textContent = `The savings, debt and owner shares add to ${Math.round(total * 100)}% of net income. Anything over 100% is being spent twice.`;
    } else if (total < 0.9999) {
      warn.hidden = false;
      warn.textContent = `The three shares add to ${Math.round(total * 100)}% — the remaining ${Math.round((1 - total) * 100)}% stays in the operating account.`;
    } else warn.hidden = true;
  }

  const unsavedMessage = () => (publisherResolved && publisher
    ? "Unsaved — the board is showing your changes; Save publishes them for everyone."
    : "Unsaved — changes are live in this tab only.");

  function status(text, state = "") {
    const el = $("#ed-status");
    el.textContent = text;
    el.className = "ed-status" + (state ? " " + state : "");
  }

  /* -- rebuilding the page ------------------------------------------------ */
  // Assembled from the page's own static parts — the stylesheet, the pristine
  // markup template and the code — never from the live DOM, which by now is
  // full of rendered charts.
  function buildDocument(raw) {
    const style = document.getElementById("app-style");
    const code = document.getElementById("app-code");
    const tpl = document.getElementById("board-template");
    if (!style || !code || !tpl) return null;
    const json = JSON.stringify(raw).replace(/</g, "\\u003c");
    const fonts = $$('link[rel="stylesheet"], link[rel="preconnect"]')
      .map((l) => l.outerHTML).join("\n");
    return `<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${esc(document.title)}</title>
${fonts}
<style id="app-style">
${style.textContent}
</style>
</head>
<body>
<template id="board-template">${tpl.innerHTML}</template>
<div id="app"></div>
<script id="app-data" type="application/json">${json}<\/script>
<script id="app-code">
${code.textContent}
<\/script>
</body>
</html>`;
  }

  async function save() {
    if (!publisher) { status("Saving is only available on the published board.", "warning"); return; }
    const doc = buildDocument(window.AKP_STATE.raw);
    if (!doc) { status("This copy cannot rebuild itself — publish it first.", "warning"); return; }
    status("Saving…");
    $("#ed-save").disabled = true;
    try {
      await publisher.publish(doc);
      dirty = false;
      status("Saved. Every open view reloads to this version.", "good");
    } catch (e) {
      const code = (e && e.code) || "";
      if (code === "conflict") status("Someone saved first. Reload to see their version, then redo your change.", "warning");
      else if (code === "not_writer" || code === "not_granted") status("You have view-only access to this board.", "warning");
      else status("Save failed: " + (e && e.message ? e.message : "unknown error"), "critical");
    } finally {
      $("#ed-save").disabled = false;
    }
  }

  function open() { document.body.classList.add("ed-open"); $("#editor").hidden = false; build(); status(dirty ? unsavedMessage() : "Type a number and the whole board recalculates."); $("#ed-close").focus(); }
  function close() { document.body.classList.remove("ed-open"); $("#editor").hidden = true; $("#edit-toggle").focus(); }

  function init() {
    const btn = $("#edit-toggle");
    if (!btn) return;
    btn.hidden = false;
    btn.addEventListener("click", () => (document.body.classList.contains("ed-open") ? close() : open()));
    $("#ed-close").addEventListener("click", close);
    $("#ed-save").addEventListener("click", save);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && document.body.classList.contains("ed-open")) close();
    });
    window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

    // The runtime answers later, never in this first run.
    if (typeof claude !== "undefined" && claude && typeof claude.use === "function") {
      claude.use("artifact").then((ns) => {
        publisher = ns || null; publisherResolved = true;
        $("#ed-save").hidden = !publisher;
        if (!publisher) $("#ed-local").hidden = false;
      }).catch(() => { publisherResolved = true; $("#ed-local").hidden = false; });
    } else {
      publisherResolved = true;
      $("#ed-save").hidden = true;
      $("#ed-local").hidden = false;
    }
  }

  // buildDocument is exposed so the round trip can be tested without publishing.
  return { init, buildDocument };
})();

window.Editor = Editor;


/* =============================================================================
   Amazing Kids PPEC — Operations Board
   Renders the board from the computed model, and — when the page is running as
   a published Artifact — lets an editor change the inputs and save a new
   version that everyone sees.
   ========================================================================== */

(() => {
  "use strict";

  /* Data comes from the JSON island in the published page, or from data.js in
     the working copy. RAW is the inputs; M is everything calculated from them. */
  const island = document.getElementById("app-data");
  let RAW = island ? JSON.parse(island.textContent) : window.AKP_DATA;
  let M = Model.build(RAW);

  const F = Charts.fmt;
  const $  = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

  const have = (v) => {
    if (v === null || v === undefined) return false;
    if (Array.isArray(v)) return v.length > 0;
    if (typeof v === "object") return Object.keys(v).length > 0;
    if (typeof v === "string") return v.trim() !== "";
    return true;
  };
  let AWAITING = [];
  function need(cardId, label, ...values) {
    if (values.every(have)) return true;
    const card = document.getElementById(cardId);
    if (card) card.hidden = true;
    if (label && !AWAITING.includes(label)) AWAITING.push(label);
    return false;
  }

  const AS_OF = new Date("2026-08-31T00:00:00");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const chip = (text, state = "", plain = false) =>
    `<span class="chip ${state}${plain ? " plain" : ""}">${esc(text)}</span>`;
  const signed = (v, d = 1) => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(d);
  const signedUsd = (v) => (v >= 0 ? "+" : "−") + F.usd(Math.abs(v));
  const pctDelta = (now, was) => (was ? signed(((now - was) / Math.abs(was)) * 100, 0) + "%" : "—");
  const shortDate = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "2-digit" });
  const stats = (items) => items.map((s) =>
    `<div class="stat"><span class="v num">${esc(s.v)}</span><span class="k">${esc(s.k)}</span></div>`).join("");
  const usd2 = (v) => "$" + v.toFixed(2);

  function twin(node, headers, rows) {
    $$(".table-wrap", node).forEach((n) => n.remove());
    const wrap = document.createElement("div");
    wrap.className = "table-wrap";
    wrap.innerHTML =
      `<table class="data"><thead><tr>${headers
        .map((h, i) => `<th${i ? ' class="n"' : ""}>${esc(h)}</th>`).join("")}</tr></thead>` +
      `<tbody>${rows.map((r) => `<tr>${r
        .map((c, i) => `<td${i ? ' class="n"' : ""}>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    node.appendChild(wrap);
  }

  /* ======================= Lead band ==================================== */
  function tiles() {
    const t = [], r = M.roster, tg = RAW.targets, l = M.latest, pr = M.prior,
          lm = M.latestMoney, pm = M.priorMoney, p = M.projection;
    if (r) {
      t.push({ label: "Enrolled now", v: F.int(r.enrolled),
        sub: `current roster · ${l ? l.enrolled + " attended in " + l.label : "—"}`,
        delta: l ? `${signed(r.enrolled - l.enrolled, 0)} vs. ${l.label}` : "",
        good: l ? r.enrolled >= l.enrolled : true,
        target: tg ? `${tg.enrollment} by ${tg.enrollmentHorizon.split("–").pop()}` : "—",
        state: !tg || r.enrolled >= tg.enrollment ? "good" : "warning" });
      t.push({ label: "Medicaid approved", v: F.int(r.medicaidApproved),
        sub: `of ${r.enrolled} enrolled · ${r.awaitingApproval} awaiting approval`,
        delta: `${F.pct0(r.approvedShare)} of the roster`, good: r.awaitingApproval === 0,
        target: "—", state: r.awaitingApproval === 0 ? "good" : "warning" });
      t.push({ label: "Pending enrollment", v: F.int(r.pending),
        sub: p ? `assumed to start in ${p.pendingStartLabel}` : "not yet started",
        delta: p && p.pendingValue ? `+${F.usdk(p.pendingValue)} if all start` : "",
        good: true, target: "—", state: "good" });
    }
    if (l) {
      t.push({ label: "Attendance rate", v: F.pct1(l.attendance),
        sub: `${l.label} · daily census ÷ enrolled`,
        delta: pr ? `${signed((l.attendance - pr.attendance) * 100)} pts vs. ${pr.label}` : "",
        good: pr ? l.attendance >= pr.attendance : true,
        target: p ? F.pct0(p.attendanceRate) + " assumed" : "—", state: "" });
      t.push({ label: "Child-days delivered", v: F.int(l.childDays),
        sub: `${l.label} · the billable unit`,
        delta: pr ? `${signed(l.childDays - pr.childDays, 0)} vs. ${pr.label}` : "",
        good: pr ? l.childDays >= pr.childDays : true, target: "—",
        state: pr && l.childDays < pr.childDays ? "warning" : "" });
    }
    if (lm) {
      t.push({ label: "Revenue", v: F.usd(lm.revenue), sub: `${lm.label} · cash basis`,
        delta: pm ? `${pctDelta(lm.revenue, pm.revenue)} vs. ${pm.label}` : "",
        good: pm ? lm.revenue >= pm.revenue : true, target: "—", state: "" });
      t.push({ label: "Operating cost", v: F.usd(lm.cost), sub: `${lm.label} · total spend`,
        delta: pm ? `${pctDelta(lm.cost, pm.cost)} vs. ${pm.label}` : "",
        good: pm ? lm.cost <= pm.cost : true,
        target: RAW.targets ? "≤ " + F.usdk(RAW.targets.monthlyCost) : "—",
        state: RAW.targets && lm.cost > RAW.targets.monthlyCost ? "critical" : "good" });
      t.push({ label: "Net income", v: F.usd(lm.net),
        sub: `${lm.label} · ${F.pct1(lm.margin)} margin`,
        delta: pm ? `${pctDelta(lm.net, pm.net)} vs. ${pm.label}` : "",
        good: pm ? lm.net >= pm.net : true, target: "—",
        state: lm.net < 0 ? "critical" : lm.margin < 0.10 ? "warning" : "good" });
    }
    if (M.cash) {
      const prior = M.cash.lines.find((x) => x.value > 0);
      t.push({ label: "Cash in bank", v: F.usd(M.cash.inBank), sub: `as of ${M.cash.asOf}`,
        delta: prior && prior.prior ? `${signedUsd(M.cash.inBank - prior.prior)} vs. ${M.cash.priorLabel}` : "",
        good: true, target: "—", state: "good" });
    }
    if (p) {
      t.push({ label: "Operating days left", v: F.int(p.totalOpDays),
        sub: "after assumed closures", delta: `of ${p.totalWeekdays} weekdays`, good: true,
        target: "—", state: "" });
      t.push({ label: "Projected revenue", v: F.usd(p.totalRevenue),
        sub: `at ${F.pct0(p.attendanceRate)} attendance`, delta: `${usd2(RAW.perDiem)} per child-day`,
        good: true, target: "—", state: "good" });
    }
    return t;
  }

  function renderLead() {
    const lead = $("#lead");
    const l = M.latest;
    if (!l) { lead.hidden = true; return; }
    lead.hidden = false;
    const spark = M.months.map((x) => x.adc);
    lead.innerHTML =
      `<article class="card hero-card">
         <div class="card-head"><div class="titles">
           <div class="eyebrow">${esc(l.full)}</div>
           <h3>Average daily census</h3>
         </div></div>
         <div class="hero-figure">${l.adc.toFixed(1)}<span class="unit">children/day</span></div>
         <div class="hero-row">
           <span class="delta ${M.prior && l.adc >= M.prior.adc ? "up" : "down"}">${
             M.prior ? signed(l.adc - M.prior.adc, 2) + " vs. " + M.prior.label : ""}</span>
           ${RAW.targets ? chip("Target " + RAW.targets.enrollment, "", true) : ""}
         </div>
         <div class="chart" id="hero-spark" style="margin:-4px 0 -2px"></div>
         <p class="card-note">${l.childDays} child-days across ${l.opDays} operating days.
           ${l.enrolled} children attended at least once; ${l.dormant} more sit on the report with
           no attendance.</p>
       </article>` +
      tiles().map((k) =>
        `<article class="card tile"${k.state ? ` data-state="${k.state}"` : ""}>
          <div class="eyebrow">${esc(k.label)}</div>
          <div class="tile-value">${esc(k.v)}</div>
          <div class="tile-sub">${esc(k.sub)}</div>
          <div class="tile-foot">
            <span class="delta ${k.good ? "up" : "down"}">${esc(k.delta)}</span>
            ${k.target !== "—" ? chip("Target " + k.target, "", true) : ""}
          </div>
        </article>`).join("");
    if (spark.length > 1) Charts.sparkline($("#hero-spark"), spark, { height: 44 });
  }

  /* ======================= Targets ====================================== */
  function renderTargets() {
    const tg = RAW.targets;
    if (!need("card-targets", "Targets", tg) || !M.roster || !M.latestMoney) return;
    const rows = [
      { name: "Children enrolled", actual: M.roster.enrolled, target: tg.enrollment,
        fmt: F.int, owner: tg.enrollmentOwner, horizon: tg.enrollmentHorizon, dir: "up" },
      { name: "Monthly operating cost", actual: M.latestMoney.cost, target: tg.monthlyCost,
        fmt: F.usd, owner: tg.costOwner, horizon: tg.costHorizon, dir: "down" }
    ];
    let onTarget = 0;
    $("#meters").innerHTML = rows.map((t) => {
      const ratio = t.dir === "up" ? t.actual / t.target : t.target / t.actual;
      if (ratio >= 1) onTarget++;
      const state = ratio >= 1 ? "good" : ratio >= 0.92 ? "warning" : ratio >= 0.6 ? "serious" : "critical";
      const aim = t.dir === "up" ? "≥" : "≤";
      return `<div class="meter-row">
        <div class="meter-head">
          <span class="name">${esc(t.name)}</span>
          <span class="who">${esc(t.owner)} · ${esc(t.horizon)}</span>
          <span class="vals"><span class="actual">${esc(t.fmt(t.actual))}</span> / ${esc(aim + t.fmt(t.target))}</span>
        </div>
        <div class="meter-track" role="img" aria-label="${esc(t.name)}: ${esc(t.fmt(t.actual))} against ${esc(aim + t.fmt(t.target))}">
          <div class="meter-fill ${state}" style="width:${Math.max(3, Math.min(100, ratio * 100)).toFixed(1)}%"></div>
        </div>
      </div>`;
    }).join("");
    if (have(tg.note)) $("#targets-note").textContent = tg.note;
    const el = $("#targets-summary");
    el.textContent = `${onTarget} of ${rows.length} on target`;
    el.className = "chip " + (onTarget === rows.length ? "good" : onTarget ? "warning" : "serious");
  }

  /* ======================= Trends ======================================= */
  const view = { range: 99 };
  const slice = (rows) => (view.range >= rows.length ? rows : rows.slice(-view.range));
  const yearLabels = (rows) => rows.map((x, i) => {
    const yr = x.full.slice(-2);
    return i === 0 || x.label === "Jan" ? `${x.label} '${yr}` : x.label;
  });
  function legend(node, keys) {
    node.innerHTML = keys.map((k) =>
      `<span class="key"><span class="swatch" style="background:var(${k.varName})"></span>${esc(k.name)}</span>`).join("");
  }

  function renderTrends() {
    const pg = $("#proj-group"); if (pg) pg.hidden = true;
    if (M.months.length <= 6) { const c = $("#controls"); if (c) c.hidden = true; }

    if (need("card-census", "Census", M.months)) {
      const rows = slice(M.months), labels = yearLabels(rows);
      legend($("#legend-census"), [
        { name: "Children enrolled", varName: "--series-1" },
        { name: "Average daily census", varName: "--series-2" }
      ]);
      Charts.line($("#chart-census"), {
        labels,
        series: [
          { name: "Enrolled", colorVar: "--series-1", values: rows.map((x) => x.enrolled) },
          { name: "Avg daily census", colorVar: "--series-2", values: rows.map((x) => x.adc),
            endFormat: F.dec1, tipFormat: F.dec1 }
        ],
        format: F.int,
        target: RAW.targets ? { value: RAW.targets.enrollment, label: `TARGET ${RAW.targets.enrollment}` } : null,
        tipTitle: (i) => rows[i].full,
        tipNote: (i) => `${F.pct1(rows[i].attendance)} attendance · ${rows[i].childDays} child-days over ${rows[i].opDays} days`
      });
      twin($("#twin-census"), ["Month", "Enrolled", "On report", "No attendance", "Operating days", "Child-days", "Daily census"],
        rows.map((x) => [x.full, F.int(x.enrolled), F.int(x.onReport), F.int(x.dormant),
          F.int(x.opDays), F.int(x.childDays), F.dec1(x.adc)]));
      const gap = $("#census-gap");
      if (RAW.targets && M.roster) {
        gap.hidden = false;
        gap.textContent = M.roster.shortOfTarget > 0
          ? `${M.roster.enrolled} enrolled today · ${M.roster.shortOfTarget} short of ${RAW.targets.enrollment}`
          : `${M.roster.enrolled} enrolled today · target of ${RAW.targets.enrollment} met`;
      } else gap.hidden = true;
    }

    if (!need("card-finance", "Revenue and cost", M.moneyMonths)) {
      const mg = document.getElementById("card-margin"); if (mg) mg.hidden = true;
      return;
    }
    const rows = slice(M.moneyMonths), labels = yearLabels(rows);
    legend($("#legend-finance"), [
      { name: "Revenue", varName: "--series-1" },
      { name: "Operating cost", varName: "--series-2" }
    ]);
    Charts.line($("#chart-finance"), {
      labels,
      series: [
        { name: "Revenue", colorVar: "--series-1", values: rows.map((x) => x.revenue), endFormat: F.usdk, tipFormat: F.usd },
        { name: "Operating cost", colorVar: "--series-2", values: rows.map((x) => x.cost), endFormat: F.usdk, tipFormat: F.usd }
      ],
      format: F.usdk, yZero: true,
      target: RAW.targets ? { value: RAW.targets.monthlyCost, label: `COST TARGET ${F.usdk(RAW.targets.monthlyCost)}` } : null,
      tipTitle: (i) => rows[i].full,
      tipNote: (i) => `Net ${F.usd(rows[i].net)} · ${F.pct1(rows[i].margin)} margin · ${F.usd(rows[i].revenuePerChildDay)} per child-day`
    });
    twin($("#twin-finance"), ["Month", "Revenue", "Operating cost", "Net", "Margin", "Per child-day"],
      rows.map((x) => [x.full, F.usd(x.revenue), F.usd(x.cost), F.usd(x.net), F.pct1(x.margin), F.usd(x.revenuePerChildDay)]));
    $("#finance-note").textContent =
      `${M.latestMoney.full}: ${F.usdk(M.latestMoney.revenue)} in, ${F.usdk(M.latestMoney.net)} net`;
    if (have(RAW.financeNote)) {
      $("#finance-caveat").textContent = RAW.financeNote +
        ` Year to date, revenue works out to ${F.usd(M.ytd.perChildDay)} per child-day across ${F.int(M.ytd.childDays)} child-days.`;
    }

    Charts.line($("#chart-margin"), {
      labels,
      series: [{ name: "Net margin", colorVar: "--series-1", values: rows.map((x) => x.margin),
                 endFormat: F.pct1, tipFormat: F.pct1 }],
      format: F.pct0, height: 196,
      tipTitle: (i) => rows[i].full,
      tipNote: (i) => `${F.usd(rows[i].net)} on ${F.usd(rows[i].revenue)}`
    });
    twin($("#twin-margin"), ["Month", "Net", "Margin"],
      rows.map((x) => [x.full, F.usd(x.net), F.pct1(x.margin)]));
    const mv = M.latestMoney.margin, pv = M.priorMoney ? M.priorMoney.margin : null;
    const mc = $("#margin-chip");
    mc.textContent = `${F.pct1(mv)} in ${M.latestMoney.label}` +
      (pv === null ? "" : ` · ${signed((mv - pv) * 100)} pts vs. ${M.priorMoney.label}`);
    mc.className = "chip " + (mv >= 0.15 ? "good" : mv >= 0.05 ? "warning" : mv >= 0 ? "serious" : "critical");
  }

  /* ======================= Projection =================================== */
  function renderProjection() {
    const p = M.projection;
    if (!need("card-projection", "Projection", p && p.months)) {
      const a = document.getElementById("card-assumptions"); if (a) a.hidden = true;
      return;
    }
    Charts.columns($("#chart-projection"), {
      labels: p.months.map((x) => x.label),
      sublabels: p.months.map((x) => x.full.slice(-4)),
      values: p.months.map((x) => x.revenue),
      format: F.usd, yFormat: F.usdk, height: 186, seriesName: "Projected revenue",
      tipTitle: (i) => p.months[i].full,
      tipNote: (i) => `${F.dec1(p.months[i].adc)} children/day × ${p.months[i].opDays} days × ${usd2(RAW.perDiem)}`
    });
    $("#tbl-projection tbody").innerHTML = p.months.map((x) =>
      `<tr>
        <td>${esc(x.full)}<span class="sub">${esc(x.closureNote || "")}</span></td>
        <td class="n">${x.weekdays}</td><td class="n">${x.closures || "—"}</td>
        <td class="n">${x.opDays}</td><td class="n">${x.enrolled}</td>
        <td class="n">${esc(F.dec1(x.adc))}</td><td class="n">${esc(F.usd(x.revenue))}</td>
      </tr>`).join("");
    $("#tbl-projection tfoot").innerHTML =
      `<tr><td>Total, ${esc(p.months[0].full)} to ${esc(p.months[p.months.length - 1].full)}</td>
       <td class="n">${p.totalWeekdays}</td><td class="n">${p.totalClosures}</td>
       <td class="n">${p.totalOpDays}</td><td class="n"></td><td class="n"></td>
       <td class="n">${esc(F.usd(p.totalRevenue))}</td></tr>`;
    $("#projection-chip").textContent = `${F.usdk(p.totalRevenue)} over ${p.totalOpDays} operating days`;

    if (!need("card-assumptions", null, p.assumptions)) return;
    $("#projection-stats").innerHTML = stats([
      { v: F.pct0(p.attendanceRate), k: "Attendance assumed" },
      { v: usd2(RAW.perDiem), k: "Per child-day" },
      { v: F.usdk(p.perChildPerMonth), k: "Per child, per month" },
      { v: F.usdk(p.pendingValue), k: `The ${M.roster.pending} pending, ${p.pendingMonthCount} months` }
    ]);
    $("#assumptions").innerHTML = p.assumptions.map((a) => `<li>${esc(a)}</li>`).join("");
    $("#projection-caveat").textContent = p.caveat +
      ` At ${F.usd(M.ytd.perChildDay)} the same projection lands at ${F.usdk(p.atRealizedRate)} instead of ${F.usdk(p.totalRevenue)}.`;
  }

  /* ======================= Distributions ================================ */
  function renderDistributions() {
    const d = M.distributions;
    if (!need("card-distributions", "Distributions", d && d.schedule)) {
      const x = document.getElementById("card-reserve"); if (x) x.hidden = true;
      return;
    }
    const pol = d.whileBuilding;
    $("#dist-policy").innerHTML = stats([
      { v: F.pct0(pol.savings), k: "To company savings" },
      { v: F.pct0(pol.debt), k: "To paying down debt" },
      { v: F.pct0(pol.owners), k: "To owner distributions" }
    ]);
    $("#tbl-distributions tbody").innerHTML = d.schedule.map((x) =>
      `<tr>
        <td>${esc(x.full)}</td>
        <td class="n">${esc(F.usd(x.revenue))}</td>
        <td class="n">${esc(F.usd(x.net))}</td>
        <td class="n">${esc(F.usd(x.toSavings))}</td>
        <td class="n">${esc(F.usd(x.toDebt))}</td>
        <td class="n">${esc(F.usd(x.toOwners))}</td>
        <td class="n">${esc(F.usd(x.reserve))}</td>
      </tr>`).join("");
    $("#tbl-distributions tfoot").innerHTML =
      `<tr><td>Total</td><td class="n">${esc(F.usd(M.projection.totalRevenue))}</td>
       <td class="n">${esc(F.usd(d.totals.net))}</td>
       <td class="n">${esc(F.usd(d.totals.savings))}</td>
       <td class="n">${esc(F.usd(d.totals.debt))}</td>
       <td class="n">${esc(F.usd(d.totals.owners))}</td>
       <td class="n">${esc(F.usd(d.endReserve))}</td></tr>`;
    const chipEl = $("#dist-chip");
    chipEl.textContent = `${F.usdk(d.totals.owners)} to owners over ${d.schedule.length} months`;
    chipEl.className = "chip accent";
    $("#dist-note").textContent = d.note + " " + d.caveat +
      ` At the realized rate the four months net about ${F.usdk(d.downside)}, which would put roughly ${F.usdk(d.downsideOwners)} in the distribution pool instead of ${F.usdk(d.totals.owners)}.`;

    if (!need("card-reserve", null, d.reserveTarget)) return;
    const pctFunded = d.startingReserve / d.reserveTarget;
    $("#reserve-stats").innerHTML = stats([
      { v: F.usdk(d.reserveTarget), k: `Savings target · ${d.monthsCovered.toFixed(1)} months of cost` },
      { v: F.usdk(d.startingReserve), k: `In the bank today · ${F.pct0(pctFunded)} of target` },
      { v: F.usdk(d.endReserve), k: "Projected at year end" },
      { v: F.usdk(d.endDebt), k: "Revolving debt still owed" }
    ]);
    const track = $("#reserve-meter");
    track.innerHTML =
      `<div class="meter-fill ${pctFunded >= 1 ? "good" : pctFunded >= 0.5 ? "warning" : "serious"}"
        style="width:${Math.max(3, Math.min(100, pctFunded * 100)).toFixed(1)}%"></div>`;
    $("#reserve-caption").textContent =
      `${F.usd(d.startingReserve)} of ${F.usd(d.reserveTarget)} today` +
      (d.targetMonth ? ` · reaches the target in ${d.targetMonth} on this schedule` : " · the schedule does not reach the target");
    const rc = $("#reserve-chip");
    rc.textContent = d.targetMonth ? `funded by ${d.targetMonth}` : "target not reached";
    rc.className = "chip " + (d.targetMonth ? "good" : "warning");

    const members = $("#tbl-members");
    if (d.showMembers && have(d.members)) {
      members.closest(".table-wrap").hidden = false;
      $("#members-head").hidden = false;
      $("#tbl-members tbody").innerHTML = d.members.map((x) =>
        `<tr><td>${esc(x.name)}</td><td class="n">${esc(F.pct1(x.share))}</td>
         <td class="n">${esc(F.usd(x.amount))}</td></tr>`).join("");
      $("#tbl-members tfoot").innerHTML =
        `<tr><td>Distribution pool</td><td class="n">100.0%</td>
         <td class="n">${esc(F.usd(d.totals.owners))}</td></tr>`;
    } else {
      members.closest(".table-wrap").hidden = true;
      $("#members-head").hidden = true;
    }
  }

  /* ======================= Cost structure & mix ========================= */
  function renderCosts() {
    const c = M.costLines;
    if (!need("card-costs", "Cost structure", c && c.lines)) {
      const mix = document.getElementById("card-mix"); if (mix) mix.hidden = true;
      return;
    }
    $("#costs-title").textContent = `Where the cost went — ${c.current}`;
    $("#th-prior").textContent = c.prior;
    $("#th-current").textContent = c.current;
    $("#tbl-costs tbody").innerHTML = c.lines.map((l) => {
      const big = Math.abs(l.change) >= c.totalCurrent * 0.02;
      const sev = !big ? "" : l.change > 0 ? "serious" : "good";
      return `<tr><td>${esc(l.name)}</td>
        <td class="n">${esc(F.usd(l.prior))}</td>
        <td class="n">${esc(F.usd(l.current))}</td>
        <td class="n">${Math.abs(l.change) < 1 ? chip("flat", "", true) : chip(signedUsd(l.change), sev, !big)}</td></tr>`;
    }).join("");
    $("#tbl-costs tfoot").innerHTML =
      `<tr><td>Total operating cost</td><td class="n">${esc(F.usd(c.totalPrior))}</td>
       <td class="n">${esc(F.usd(c.totalCurrent))}</td>
       <td class="n">${chip(signedUsd(c.change), c.change > 0 ? "serious" : "good")}</td></tr>`;
    const cc = $("#costs-chip");
    if (c.overTarget !== null) {
      cc.textContent = c.overTarget > 0
        ? `${F.usdk(c.overTarget)} over the ${F.usdk(RAW.targets.monthlyCost)} target`
        : `${F.usdk(-c.overTarget)} under the ${F.usdk(RAW.targets.monthlyCost)} target`;
      cc.className = "chip " + (c.overTarget > 0 ? "critical" : "good");
      if (c.overTarget > 0) $("#card-costs").dataset.state = "critical";
      else delete $("#card-costs").dataset.state;
    }
    const top = c.lines.slice(0, 8);
    const rest = c.lines.slice(8).reduce((a, l) => a + l.current, 0);
    $("#mix-title").textContent = `Share of ${c.current} cost`;
    Charts.bars($("#chart-mix"), {
      rows: top.map((l) => ({ label: l.name, value: l.share, note: F.usd(l.current) }))
        .concat(rest > 0 ? [{ label: "Everything else", value: rest / c.totalCurrent, note: F.usd(rest) }] : []),
      format: F.pct0, seriesName: "Share of cost"
    });
  }

  /* ======================= Cash ========================================= */
  function renderCash() {
    const c = M.cash;
    if (!need("card-cash", "Cash position", c && c.lines)) return;
    $("#cash-title").textContent = `Cash and obligations — ${c.asOf}`;
    $("#cash-stats").innerHTML = stats([
      { v: F.usdk(c.inBank), k: "Cash in bank" },
      { v: F.usdk(c.obligations), k: "Current obligations" },
      { v: F.usdk(c.net), k: "Cash net of obligations" },
      { v: F.usdk(c.ytdNet), k: "Net income, year to date" },
      { v: F.usdk(c.ytdNetPrior), k: "Same period last year" },
      { v: F.usdk(c.totalEquity), k: "Total equity" }
    ]);
    $("#tbl-cash tbody").innerHTML = c.lines.map((l) =>
      `<tr><td>${esc(l.name)}</td><td class="n">${esc(F.usd(l.value))}</td>
       <td>${l.prior != null ? chip(`${F.usd(l.prior)} ${c.priorLabel}`, "", true) : ""}</td></tr>`).join("");
    $("#tbl-cash tfoot").innerHTML =
      `<tr><td>Cash net of current obligations</td><td class="n">${esc(F.usd(c.net))}</td><td></td></tr>`;
    const chipEl = $("#cash-chip");
    chipEl.textContent = c.net > 0 ? `${F.usdk(c.net)} net of obligations` : `${F.usdk(c.net)} short of obligations`;
    chipEl.className = "chip " + (c.net > 0 ? "good" : "critical");
    if (have(c.note)) $("#cash-note").textContent = c.note;
  }

  /* ======================= Attendance & rooms =========================== */
  function renderAttendance() {
    renderRooms();
    if (!need("card-attendance", "Attendance", M.months)) return;
    const a = M.months;
    Charts.columns($("#chart-attendance"), {
      labels: a.map((x) => x.label), sublabels: a.map((x) => x.full.slice(-4)),
      values: a.map((x) => x.attendance),
      format: F.pct1, yFormat: F.pct0, height: 214,
      target: have(RAW.attendanceTargetRate)
        ? { value: RAW.attendanceTargetRate, label: "TARGET " + F.pct0(RAW.attendanceTargetRate) } : null,
      seriesName: "Attendance",
      tipTitle: (i) => a[i].full,
      tipNote: (i) => `${F.dec1(a[i].adc)} of ${a[i].enrolled} enrolled · ${a[i].childDays} child-days`
    });
    twin($("#twin-attendance"), ["Month", "Enrolled", "Operating days", "Child-days", "Daily census", "Attendance rate"],
      a.map((x) => [x.full, F.int(x.enrolled), F.int(x.opDays), F.int(x.childDays), F.dec1(x.adc), F.pct1(x.attendance)]));
    const cur = M.latest, prev = M.prior;
    const ac = $("#attendance-chip");
    ac.textContent = `${F.pct1(cur.attendance)} in ${cur.label}` +
      (prev ? ` · ${signed((cur.attendance - prev.attendance) * 100)} pts vs. ${prev.label}` : "");
    ac.className = "chip " + (cur.attendance >= 0.85 ? "good" : cur.attendance >= 0.75 ? "warning" : "serious");
  }

  function renderRooms() {
    const r = M.rooms;
    if (!need("card-rooms", null, r && r.list)) return;
    $("#rooms-eyebrow").textContent = r.month;
    Charts.bars($("#chart-rooms"), {
      rows: r.list.map((x) => ({ label: x.name, value: x.adc,
        note: `${x.attending} attending of ${x.onReport} on the report` })),
      format: F.dec1, seriesName: "Daily census"
    });
    $("#rooms-stats").innerHTML = stats([
      { v: F.int(r.attending), k: "Children attending" },
      { v: F.int(r.list.length), k: "Rooms in use" }
    ].concat(have(r.partnerSchool) ? [{ v: F.int(r.partnerSchool.children), k: "At the partner school" }] : []));
    if (have(r.partnerSchool)) {
      $("#rooms-note").textContent =
        `${r.partnerSchool.children} of the children are enrolled at ${r.partnerSchool.name}. ` +
        `Bars are average daily census, so they add to the centre's ${F.dec1(r.adc)}.`;
    }
  }

  /* ======================= Roster movement ============================== */
  function renderRoster() {
    if (need("card-dormant", "Roster hygiene", M.months)) {
      Charts.columns($("#chart-dormant"), {
        labels: M.months.map((x) => x.label), sublabels: M.months.map((x) => x.full.slice(-4)),
        values: M.months.map((x) => x.dormant),
        format: F.int, height: 196, seriesName: "No attendance",
        tipTitle: (i) => M.months[i].full,
        tipNote: (i) => `${M.months[i].onReport} on the report, ${M.months[i].enrolled} attended`
      });
      const dc = $("#dormant-chip");
      dc.textContent = `${M.latest.dormant} of ${M.latest.onReport} on the report in ${M.latest.label}`;
      dc.className = "chip " + (M.latest.dormant <= 2 ? "good" : M.latest.dormant <= 5 ? "warning" : "serious");
    }
    const moved = M.months.filter((x) => x.started != null);
    if (!need("card-movement", null, moved)) return;
    $("#tbl-movement tbody").innerHTML = moved.map((x) => {
      const net = x.started - x.stopped;
      return `<tr><td>${esc(x.full)}</td>
        <td class="n">${x.started || "—"}</td><td class="n">${x.stopped || "—"}</td>
        <td class="n">${net === 0 ? chip("flat", "", true) : chip(signed(net, 0), net > 0 ? "good" : "serious")}</td>
        <td class="n">${F.int(x.enrolled)}</td></tr>`;
    }).join("");
    $("#movement-chip").textContent =
      `${moved.reduce((a, x) => a + x.started, 0)} started, ${moved.reduce((a, x) => a + x.stopped, 0)} stopped since ${moved[0].label}`;
  }

  /* ======================= Staffing ===================================== */
  function renderStaffing() {
    const s = M.staffing;
    if (!need("card-staff", "Staffing", s && s.roles)) {
      const x = document.getElementById("card-staff-model"); if (x) x.hidden = true;
      return;
    }
    if (have(s.asOf)) $("#staff-eyebrow").textContent = "As of " + s.asOf;
    $("#staff-stats").innerHTML = stats([
      { v: F.int(s.fullTime), k: "Full time" }, { v: F.int(s.partTime), k: "Part time" },
      { v: F.int(s.perDiem), k: "Per diem" }, { v: F.int(s.total), k: "On the team" }
    ]);
    Charts.bars($("#chart-staff"), {
      rows: s.roles.map((r) => ({ label: r.role, value: r.count, note: r.type })),
      format: F.int, seriesName: "Staff"
    });
    twin($("#twin-staff"), ["Role", "Employment", "Staff"],
      s.roles.map((r) => [r.role, r.type, F.int(r.count)]));
    $("#staff-chip").textContent = `${s.total} on the team`;
    $("#staff-chip").className = "chip";
    if (have(s.discrepancy)) {
      $("#staff-note").textContent = s.discrepancy;
      $("#card-staff").dataset.state = "warning";
    }
    const dm = s.dailyModel;
    if (!need("card-staff-model", null, dm && dm.lines)) return;
    $("#model-title").textContent = `Daily staffing for ${dm.supports} children`;
    $("#tbl-staff-model tbody").innerHTML = dm.lines.map((l) => {
      const state = l.spare <= 0 ? "critical" : l.spare === 1 ? "warning" : "good";
      const label = l.spare <= 0 ? "no spare" : l.spare === 1 ? "1 spare" : `${l.spare} spare`;
      return `<tr><td>${esc(l.role)}</td><td class="n">${l.perDay}</td>
        <td class="n">${l.roster}<span class="sub">${esc(l.have)}</span></td>
        <td>${chip(label, state)}</td></tr>`;
    }).join("");
    $("#tbl-staff-model tfoot").innerHTML =
      `<tr><td>On the floor each day</td><td class="n">${dm.perDay}</td>
       <td class="n">${dm.scheduled}</td>
       <td>${chip(`1 staff per ${dm.childrenPerStaff.toFixed(1)} children at ${dm.supports}`, "", true)}</td></tr>`;
    $("#model-chip").textContent = `${dm.perDay} on the floor supports ${dm.supports} children`;
    $("#model-note").textContent = [dm.excludes, dm.note].filter(have).join(" ") +
      (dm.atProjected ? ` At the projection's closing census, about ${F.dec1(M.projection.months[M.projection.months.length - 1].adc)} children a day, it is one per ${dm.atProjected.toFixed(1)}.` : "");
  }

  /* ======================= Marketing ==================================== */
  function renderMarketing() {
    const a = M.adSpend;
    if (!need("card-adspend", "Marketing", a && a.months)) return;
    Charts.columns($("#chart-adspend"), {
      labels: a.months.map((x) => x.label), values: a.months.map((x) => x.value),
      format: F.usd, yFormat: F.usdk, height: 190, seriesName: "Spend",
      tipTitle: (i) => a.months[i].label
    });
    $("#adspend-stats").innerHTML = stats([
      { v: F.usdk(a.ytd), k: "Year to date" },
      { v: F.usdk(a.ytdPrior), k: "Same period last year" },
      { v: F.usd(a.latest.value), k: "Latest month" }
    ]);
    const ch = $("#adspend-chip");
    ch.textContent = `${F.pct0(a.vsPrior)} of last year's spend`;
    ch.className = "chip";
    if (have(a.note)) $("#adspend-note").textContent = a.note;
  }

  /* ======================= Task board =================================== */
  const DONE_KEY = "akp.tasks.done";
  const readDone = () => { try { return new Set(JSON.parse(localStorage.getItem(DONE_KEY) || "[]")); } catch { return new Set(); } };
  const writeDone = (s) => { try { localStorage.setItem(DONE_KEY, JSON.stringify([...s])); } catch { /* private mode */ } };
  let taskFilter = "open";
  const isDone = (t, done) => t.status === "Done" || done.has(t.id);
  const isOverdue = (t, done) => !!t.due && !isDone(t, done) && new Date(t.due + "T00:00:00") < AS_OF;

  function renderTasks() {
    if (!need("card-tasks", "Task board", RAW.tasks)) return;
    const done = readDone();
    const all = RAW.tasks.slice().sort((a, b) => (a.due || "9999").localeCompare(b.due || "9999"));
    const rows = all.filter((t) => {
      if (taskFilter === "all") return true;
      if (taskFilter === "open") return !isDone(t, done);
      if (taskFilter === "blocked") return t.status === "Blocked";
      if (taskFilter === "overdue") return isOverdue(t, done);
      return true;
    });
    $("#tbl-tasks tbody").innerHTML = rows.map((t) => {
      const d = isDone(t, done), over = isOverdue(t, done);
      const st = d ? "good" : t.status === "Blocked" ? "critical" : t.status === "In progress" ? "accent" : "";
      return `<tr class="${d ? "is-done" : ""}">
        <td class="check"><input type="checkbox" data-task="${esc(t.id)}" ${d ? "checked" : ""}
             ${t.status === "Done" ? "disabled" : ""} aria-label="Mark ${esc(t.id)} complete"></td>
        <td class="title">${esc(t.title)}${t.note ? `<span class="note">${esc(t.note)}</span>` : ""}</td>
        <td>${esc(t.area)}</td><td>${esc(t.owner)}</td>
        <td><span class="pri ${esc(t.priority)}">${esc(t.priority)}</span></td>
        <td class="n">${t.due ? esc(shortDate(t.due)) : `<span class="chip plain">no date</span>`}${over ? ` ${chip("overdue", "critical")}` : ""}</td>
        <td>${chip(d ? "Done" : t.status, st, !st)}</td></tr>`;
    }).join("") || `<tr><td colspan="7" style="color:var(--ink-3);padding:14px 0">Nothing in this view.</td></tr>`;
    const open = all.filter((t) => !isDone(t, done)).length;
    const overdue = all.filter((t) => isOverdue(t, done)).length;
    const blocked = all.filter((t) => t.status === "Blocked").length;
    const undated = all.filter((t) => !t.due && !isDone(t, done)).length;
    $("#task-count").textContent = `${rows.length} shown · ${open} open · ${overdue} overdue · ${undated} with no date`;
    const tc = $("#tasks-chip");
    tc.textContent = overdue ? `${overdue} overdue` : blocked ? `${blocked} blocked` : `${open} open`;
    tc.className = "chip " + (overdue ? "critical" : blocked || undated ? "warning" : "good");
    if (overdue) $("#card-tasks").dataset.state = "critical"; else delete $("#card-tasks").dataset.state;
    if (have(RAW.tasksNote)) $("#tasks-note").textContent = RAW.tasksNote;
    $$("#tbl-tasks input[type=checkbox]").forEach((box) => {
      box.addEventListener("change", () => {
        const s = readDone();
        box.checked ? s.add(box.dataset.task) : s.delete(box.dataset.task);
        writeDone(s); renderTasks();
      });
    });
  }

  /* ======================= Chrome ======================================= */
  function renderBrand() {
    const img = $("#brand-logo"), mark = $("#brand-mark"), text = $("#facility-name");
    if (!img || !have(RAW.meta.logo)) return;
    img.addEventListener("load", () => { img.hidden = false; if (mark) mark.hidden = true; if (text) text.hidden = true; });
    img.addEventListener("error", () => { img.hidden = true; if (mark) mark.hidden = false; if (text) text.hidden = false; });
    img.alt = RAW.meta.logoAlt || RAW.meta.facility;
    img.src = RAW.meta.logo;
  }

  function renderChrome() {
    $("#facility-name").textContent = RAW.meta.facility;
    $("#foot-facility").textContent = RAW.meta.facility;
    $("#board-name").textContent = RAW.meta.boardName;
    $("#as-of").textContent = RAW.meta.asOf;
    $("#period-label").textContent = RAW.meta.period;
    $("#demo-chip").hidden = !RAW.meta.sampleData;
    if (have(RAW.meta.sourceNote)) $("#foot-source").textContent = RAW.meta.sourceNote;
  }

  function pruneEmptySections() {
    $$("section.section").forEach((sec) => {
      const cards = $$(".card", sec);
      sec.hidden = cards.length > 0 && cards.every((c) => c.hidden);
    });
    const note = $("#coverage-note");
    if (!note) return;
    if (!AWAITING.length) { note.hidden = true; return; }
    note.hidden = false;
    note.innerHTML = "Waiting on data: <strong>" + AWAITING.map(esc).join("</strong>, <strong>") +
      "</strong>. Those sections stay hidden until their numbers are entered.";
  }

  /* Full re-render. Every card is un-hidden first so a card that was hidden for
     want of data comes back the moment the data is entered. */
  function renderAll() {
    M = Model.build(RAW);
    AWAITING = [];
    $$(".card").forEach((c) => { c.hidden = false; });
    $$("section.section").forEach((s) => { s.hidden = false; });
    renderChrome();
    renderLead();
    renderTargets();
    renderTrends();
    renderProjection();
    renderDistributions();
    renderCosts();
    renderCash();
    renderAttendance();
    renderRoster();
    renderStaffing();
    renderMarketing();
    renderTasks();
    pruneEmptySections();
  }
  window.AKP_RENDER = renderAll;
  window.AKP_STATE = { get raw() { return RAW; }, set raw(v) { RAW = v; } };

  /* ======================= Boot ========================================= */
  function boot() {
    const tpl = document.getElementById("board-template");
    const mount = document.getElementById("app");
    if (tpl && mount && !mount.childElementCount) mount.appendChild(tpl.content.cloneNode(true));

    renderBrand();
    renderAll();

    $$(".segmented button[data-range]").forEach((b) => {
      b.addEventListener("click", () => {
        view.range = Number(b.dataset.range);
        $$(".segmented button[data-range]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
        renderTrends();
      });
    });
    $$("[data-task-filter]").forEach((b) => {
      b.addEventListener("click", () => {
        taskFilter = b.dataset.taskFilter;
        $$("[data-task-filter]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
        renderTasks();
      });
    });

    const root = document.documentElement;
    try { const saved = localStorage.getItem("akp.theme"); if (saved) root.setAttribute("data-theme", saved); } catch { /* private mode */ }
    $("#theme-toggle").addEventListener("click", () => {
      const dark = root.getAttribute("data-theme") === "dark" ||
        (!root.hasAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
      const next = dark ? "light" : "dark";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("akp.theme", next); } catch { /* private mode */ }
      document.dispatchEvent(new Event("akp:theme"));
    });

    if (typeof Editor !== "undefined" && Editor && Editor.init) Editor.init();
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => document.dispatchEvent(new Event("akp:theme")));
    }
  }

  document.readyState === "loading" ? document.addEventListener("DOMContentLoaded", boot) : boot();
})();

</script>
