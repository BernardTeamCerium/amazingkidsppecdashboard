<title>Amazing Kids PPEC Operations Board</title>
<meta name="description" content="Operating picture for Amazing Kids PPEC: census and attendance through August 2026, revenue, cost and cash through July, room mix, roster movement, marketing spend and the open task list.">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style id="app-style">
/* =============================================================================
   Amazing Kids PPEC — Operations Board
   Tokens first, components second. Every color is a token so both themes
   resolve as a complete set; nothing is defined only inside a theme block.
   ========================================================================== */

:root {
  color-scheme: light;

  /* Neutrals are pulled toward the logo's navy rather than a default grey, so
     the brand mark sits in a page that already shares its temperature. */
  --brand-navy:   #052c45;
  --brand-gold:   #ffbb02;
  --plane:        #e9eef3;
  --surface:      #ffffff;
  --surface-2:    #f4f7fa;
  --surface-3:    #e4ebf1;
  --ink:          #052c45;   /* the logo navy, doing the work of near-black */
  --ink-2:        #46606f;
  --ink-3:        #78909f;
  --rule:         #d9e3ea;
  --rule-strong:  #bccbd7;
  --logo-plate:   transparent;
  --shadow:       0 1px 2px rgba(5, 44, 69, .05), 0 8px 24px -16px rgba(5, 44, 69, .20);

  /* Accent + chart series. Series are navy-shifted toward the brand and still
     clear every gate on this surface: adjacent CVD ΔE 23.6, contrast ≥ 3:1. */
  --accent:       #1668a5;
  --accent-ink:   #0f4f80;
  --accent-wash:  rgba(22, 104, 165, .10);
  --series-1:     #2a6fc4;
  --series-2:     #eb6834;

  /* Ordinal ramp for the pipeline stages (validated --ordinal, light end 2.11:1) */
  --ord-1: #86b6ef;
  --ord-2: #5598e7;
  --ord-3: #2a78d6;
  --ord-4: #1c5cab;
  --ord-5: #104281;

  /* Status — reserved, never reused as a series color */
  --good:      #0ca30c;
  --warning:   #fab219;
  --serious:   #ec835a;
  --critical:  #d03b3b;
  --good-ink:     #006300;
  --warning-ink:  #8a5a00;
  --serious-ink:  #a2451f;
  --critical-ink: #b02c2c;
  --good-wash:     rgba(12, 163, 12, .10);
  --warning-wash:  rgba(250, 178, 25, .16);
  --serious-wash:  rgba(236, 131, 90, .16);
  --critical-wash: rgba(208, 59, 59, .10);

  /* Chart chrome */
  --grid:     #e4ebf1;
  --axis:     #bccbd7;
  --chart-bg: var(--surface);

  --font-display: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body:    "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:    "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --r-card: 10px;
  --r-chip: 4px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --plane:       #071520;
    --surface:     #0f2534;
    --surface-2:   #16303f;
    --surface-3:   #1e3c4d;
    --ink:         #eef4f8;
    --ink-2:       #a7bcc9;
    --ink-3:       #7c94a3;
    --rule:        #1d3a4b;
    --rule-strong: #2c4d61;
    --logo-plate:  #ffffff;
    --shadow:      0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .6);

    --accent:      #4e9fe0;
    --accent-ink:  #8fc4f0;
    --accent-wash: rgba(78, 159, 224, .18);
    --series-1:    #3f8fdd;
    --series-2:    #d95926;

    --ord-1: #cde2fb;
    --ord-2: #9ec5f4;
    --ord-3: #6da7ec;
    --ord-4: #3987e5;
    --ord-5: #256abf;

    --good-ink:     #0ca30c;
    --warning-ink:  #fab219;
    --serious-ink:  #ec835a;
    --critical-ink: #e26a6a;
    --good-wash:     rgba(12, 163, 12, .16);
    --warning-wash:  rgba(250, 178, 25, .14);
    --serious-wash:  rgba(236, 131, 90, .14);
    --critical-wash: rgba(208, 59, 59, .18);

    --grid: #1a3746;
    --axis: #2c4d61;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --plane:       #071520;
  --surface:     #0f2534;
  --surface-2:   #16303f;
  --surface-3:   #1e3c4d;
  --ink:         #eef4f8;
  --ink-2:       #a7bcc9;
  --ink-3:       #7c94a3;
  --rule:        #1d3a4b;
  --rule-strong: #2c4d61;
  --logo-plate:  #ffffff;
  --shadow:      0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px -16px rgba(0, 0, 0, .6);

  --accent:      #4e9fe0;
  --accent-ink:  #8fc4f0;
  --accent-wash: rgba(78, 159, 224, .18);
  --series-1:    #3f8fdd;
  --series-2:    #d95926;

  --ord-1: #cde2fb;
  --ord-2: #9ec5f4;
  --ord-3: #6da7ec;
  --ord-4: #3987e5;
  --ord-5: #256abf;

  --good-ink:     #0ca30c;
  --warning-ink:  #fab219;
  --serious-ink:  #ec835a;
  --critical-ink: #e26a6a;
  --good-wash:     rgba(12, 163, 12, .16);
  --warning-wash:  rgba(250, 178, 25, .14);
  --serious-wash:  rgba(236, 131, 90, .14);
  --critical-wash: rgba(208, 59, 59, .18);

  --grid: #1a3746;
  --axis: #2c4d61;
}

/* ---- Base ---------------------------------------------------------------- */
* { box-sizing: border-box; }

/* Cards and sections are flex/grid, so hidden needs to win over display. */
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--plane);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3 { font-family: var(--font-display); font-weight: 600; margin: 0; text-wrap: balance; }

a { color: var(--accent-ink); }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 3px;
}

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

.eyebrow {
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--ink-3);
}

.num { font-variant-numeric: tabular-nums; }

.visually-hidden {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

code {
  font-family: var(--font-mono);
  font-size: .92em;
  background: var(--surface-3);
  padding: 1px 5px;
  border-radius: 3px;
  color: var(--ink-2);
}

/* ---- Masthead ------------------------------------------------------------ */
.masthead {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
  box-shadow: inset 0 -3px 0 var(--brand-gold);   /* the one brand signature */
}

.masthead-inner {
  max-width: 1560px;
  margin: 0 auto;
  padding: 11px 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}

.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }

/* The logo is navy line art, so on a dark ground it needs a light plate to sit
   on. In light mode the plate is the surface itself, so it disappears. */
.brand-logo {
  height: 54px;   /* the mark is close to square, so height drives the lockup */
  width: auto;
  max-width: 190px;
  display: block;
  background: var(--logo-plate);
  border-radius: 10px;
  padding: 5px 9px;
}

.mark {
  width: 38px; height: 38px;
  flex: 0 0 38px;
  border-radius: 9px;
  background: var(--brand-navy);
  color: var(--brand-gold);
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: .02em;
}

.masthead h1 { font-size: 17px; letter-spacing: -.01em; line-height: 1.2; }
.masthead .sub { color: var(--ink-3); font-size: 12px; }
.masthead .spacer { flex: 1 1 auto; }

.asof {
  text-align: right;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--ink-2);
  line-height: 1.45;
}
.asof strong { color: var(--ink); font-weight: 500; }

.demo-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 9px;
  border-radius: var(--r-chip);
  background: var(--warning-wash);
  color: var(--warning-ink);
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: .06em;
  text-transform: uppercase;
  border: 1px solid rgba(250, 178, 25, .35);
}

.icon-btn {
  height: 32px;
  padding: 0 11px;
  border: 1px solid var(--rule-strong);
  border-radius: 6px;
  background: var(--surface);
  color: var(--ink-2);
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: .05em;
  text-transform: uppercase;
  cursor: pointer;
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }

/* ---- Control bar --------------------------------------------------------- */
.controls {
  max-width: 1560px;
  margin: 0 auto;
  padding: 16px 24px 0;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.segmented {
  display: inline-flex;
  border: 1px solid var(--rule-strong);
  border-radius: 6px;
  overflow: hidden;
  background: var(--surface);
}
.segmented button {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--ink-2);
  font-family: var(--font-mono);
  font-size: 11.5px;
  letter-spacing: .04em;
  padding: 7px 13px;
  cursor: pointer;
  border-right: 1px solid var(--rule);
}
.segmented button:last-child { border-right: 0; }
.segmented button:hover { background: var(--surface-2); color: var(--ink); }
.segmented button[aria-pressed="true"] { background: var(--accent); color: #fff; }

.controls .hint { color: var(--ink-3); font-size: 12px; }

/* ---- Board layout -------------------------------------------------------- */
.board {
  max-width: 1560px;
  margin: 0 auto;
  padding: 16px 24px 56px;
  display: flex;
  flex-direction: column;
  gap: 26px;
}

.section-head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--rule-strong);
}
.section-head h2 { font-size: 13px; letter-spacing: .02em; }
.section-head .section-note { color: var(--ink-3); font-size: 12px; margin-left: auto; }

.section { display: flex; flex-direction: column; gap: 14px; }

.grid {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 14px;
  align-items: start;   /* cards hug their content — no dead space under short cards */
}
.col-3  { grid-column: span 3; }
.col-4  { grid-column: span 4; }
.col-5  { grid-column: span 5; }
.col-6  { grid-column: span 6; }
.col-7  { grid-column: span 7; }
.col-8  { grid-column: span 8; }
.col-12 { grid-column: span 12; }

@media (max-width: 1180px) {
  .col-3, .col-4, .col-5 { grid-column: span 6; }
  .col-7, .col-8 { grid-column: span 12; }
}
@media (max-width: 760px) {
  .col-3, .col-4, .col-5, .col-6, .col-7, .col-8 { grid-column: span 12; }
  .masthead-inner, .controls, .board { padding-left: 14px; padding-right: 14px; }
}

/* ---- Card ---------------------------------------------------------------- */
.card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--r-card);
  box-shadow: var(--shadow);
  padding: 15px 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
  overflow: hidden;
}

/* A severity stripe on the left edge — only on cards that need attention. */
.card[data-state]::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
}
.card[data-state="warning"]::before  { background: var(--warning); }
.card[data-state="serious"]::before  { background: var(--serious); }
.card[data-state="critical"]::before { background: var(--critical); }
.card[data-state="good"]::before     { background: var(--good); }

.card-head { display: flex; align-items: flex-start; gap: 10px; }
.card-head .titles { min-width: 0; }
.card-head h3 { font-size: 14.5px; letter-spacing: -.005em; margin-top: 2px; }
.card-head .card-meta { margin-left: auto; text-align: right; flex: 0 0 auto; }

.card-note {
  color: var(--ink-3);
  font-size: 12px;
  line-height: 1.45;
  border-top: 1px solid var(--rule);
  padding-top: 10px;
  margin-top: auto;
}

/* ---- Chips --------------------------------------------------------------- */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  border-radius: var(--r-chip);
  font-family: var(--font-mono);
  font-size: 11px;
  line-height: 1.35;
  white-space: nowrap;
  background: var(--surface-3);
  color: var(--ink-2);
}
.chip::before {
  content: "";
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
  flex: 0 0 6px;
}
.chip.plain::before { display: none; }
.chip.good     { background: var(--good-wash);     color: var(--good-ink); }
.chip.warning  { background: var(--warning-wash);  color: var(--warning-ink); }
.chip.serious  { background: var(--serious-wash);  color: var(--serious-ink); }
.chip.critical { background: var(--critical-wash); color: var(--critical-ink); }
.chip.accent   { background: var(--accent-wash);   color: var(--accent-ink); }

.delta { font-family: var(--font-mono); font-size: 11.5px; }
.delta.up   { color: var(--good-ink); }
.delta.down { color: var(--critical-ink); }
.delta.flat { color: var(--ink-3); }

/* ---- Lead band ----------------------------------------------------------- */
.lead {
  display: grid;
  grid-template-columns: minmax(260px, 1.15fr) repeat(3, minmax(0, 1fr));
  gap: 14px;
}
@media (max-width: 1180px) { .lead { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px)  { .lead { grid-template-columns: minmax(0, 1fr); } }

.hero-card { justify-content: space-between; }
.hero-figure {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 52px;
  line-height: 1;
  letter-spacing: -.03em;
  color: var(--ink);
}
.hero-figure .unit {
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 500;
  letter-spacing: 0;
  color: var(--ink-3);
  margin-left: 8px;
}
.hero-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.tile { gap: 8px; padding: 14px 15px; }
.tile .tile-value {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 30px;
  line-height: 1;
  letter-spacing: -.02em;
}
.tile .tile-sub { color: var(--ink-3); font-size: 12px; }
.tile .tile-foot {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-top: auto; padding-top: 4px;
}

/* ---- Meters (targets) ---------------------------------------------------- */
.meters { display: flex; flex-direction: column; gap: 14px; }
.meter-row { display: flex; flex-direction: column; gap: 6px; }
.meter-head { display: flex; align-items: baseline; gap: 8px; font-size: 13px; }
.meter-head .name { color: var(--ink); }
.meter-head .vals {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.meter-head .vals .actual { color: var(--ink); font-weight: 500; }
.meter-head .who {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--ink-3);
  white-space: nowrap;
}
.meter-track {
  position: relative;
  height: 8px;
  border-radius: 4px;
  background: var(--surface-3);
  overflow: hidden;
}
.meter-fill { height: 100%; border-radius: 4px; background: var(--accent); }
.meter-fill.good     { background: var(--good); }
.meter-fill.warning  { background: var(--warning); }
.meter-fill.serious  { background: var(--serious); }
.meter-fill.critical { background: var(--critical); }
.meter-sub { font-size: 11.5px; color: var(--ink-3); font-family: var(--font-mono); }

/* ---- Tables -------------------------------------------------------------- */
.table-wrap { overflow-x: auto; }
table.data {
  width: 100%;
  border-collapse: collapse;
  font-size: 12.5px;
}
table.data th, table.data td {
  text-align: left;
  padding: 7px 10px 7px 0;
  border-bottom: 1px solid var(--rule);
  vertical-align: top;
}
table.data thead th {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 500;
  border-bottom: 1px solid var(--rule-strong);
  white-space: nowrap;
}
table.data tbody tr:last-child td { border-bottom: 0; }
table.data td.n, table.data th.n {
  text-align: right;
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  padding-right: 14px;
}
table.data td.n:last-child, table.data th.n:last-child { padding-right: 0; }
table.data td.mono, table.data th.mono {
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  padding-right: 14px;
}
table.data tbody tr:hover td { background: var(--surface-2); }
table.data td .sub { color: var(--ink-3); font-size: 11.5px; display: block; }
table.data tfoot td {
  padding-top: 8px;
  border-top: 1px solid var(--rule-strong);
  font-weight: 600;
}

/* ---- Stat strip ---------------------------------------------------------- */
.stat-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
  gap: 10px;
  padding: 11px 0;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
}
.stat-strip.no-rule { border: 0; padding: 0; }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .v {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 19px;
  line-height: 1.1;
  letter-spacing: -.01em;
}
.stat .k { font-size: 11.5px; color: var(--ink-3); line-height: 1.3; }

/* ---- Charts -------------------------------------------------------------- */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart text { font-family: var(--font-mono); }
.tick { font-size: 10px; fill: var(--ink-3); }
.axis-line { stroke: var(--axis); stroke-width: 1; }
.grid-line { stroke: var(--grid); stroke-width: 1; }
.ref-line { stroke: var(--ink-3); stroke-width: 1; }
.ref-label { font-size: 10px; fill: var(--ink-3); }
.dlabel { font-size: 11px; fill: var(--ink); font-weight: 500; }
.bar-name { font-family: var(--font-body); font-size: 11.5px; fill: var(--ink-2); }
.dlabel.muted { fill: var(--ink-2); }

.legend {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--ink-2);
}
.legend .key { display: inline-flex; align-items: center; gap: 6px; }
.legend .swatch { width: 12px; height: 3px; border-radius: 2px; background: var(--series-1); }
.legend .swatch.dot { width: 9px; height: 9px; border-radius: 50%; }
.legend .swatch.dashed {
  height: 0;
  border-top: 3px dotted var(--ink-3);
  border-radius: 0;
  background: none;
  width: 14px;
}

.chart-tip {
  position: absolute;
  z-index: 20;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, -100%);
  background: var(--surface);
  color: var(--ink);
  border: 1px solid var(--rule-strong);
  border-radius: 6px;
  box-shadow: var(--shadow);
  padding: 8px 10px;
  font-size: 12px;
  min-width: 128px;
  transition: opacity .09s linear;
}
.chart-tip[data-show="1"] { opacity: 1; }
.chart-tip .tip-title {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 5px;
}
.chart-tip .tip-row {
  display: flex; align-items: center; gap: 8px;
  font-variant-numeric: tabular-nums;
  line-height: 1.6;
}
.chart-tip .tip-row .sw { width: 9px; height: 9px; border-radius: 2px; flex: 0 0 9px; }
.chart-tip .tip-row .v { margin-left: auto; font-family: var(--font-mono); font-size: 12px; }
.chart-tip .tip-note { color: var(--ink-3); font-size: 11px; margin-top: 4px; }

/* Table-view twin — every chart has one. */
details.twin { margin-top: 2px; }
details.twin > summary {
  cursor: pointer;
  list-style: none;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: .06em;
  text-transform: uppercase;

.pri.Critical { color: var(--critical-ink); font-weight: 600; }
.pri.High { color: var(--serious-ink); }

/* ---- Footer -------------------------------------------------------------- */
.board-foot {

@media print {

table.ed-table th {

<template id="board-template">
<header class="masthead">

<div class="controls" id="controls">
